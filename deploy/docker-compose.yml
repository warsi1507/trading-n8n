version: '3.8'

services:
  caddy:
    image: caddy:alpine
    container_name: flowtrade_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    container_name: flowtrade_api
    env_file:
      - .env
    expose:
      - "9000"
    restart: unless-stopped

  executor:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.executor
    container_name: flowtrade_executor
    env_file:
      - .env
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
