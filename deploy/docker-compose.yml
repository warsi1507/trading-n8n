version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: flowtrade_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    container_name: flowtrade_api
    env_file:
      - .env
    expose:
      - "9000"
    restart: unless-stopped

  executor:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.executor
    container_name: flowtrade_executor
    env_file:
      - .env
    restart: unless-stopped
