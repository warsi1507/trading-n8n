<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Connecting Lines -->
    <g fill="none" stroke="#373b3d" stroke-width="4" stroke-linecap="round">
        <path d="M 48 64 C 64 64, 64 28, 80 28" />
        <path d="M 48 64 C 64 64, 64 100, 80 100" />
    </g>

    <!-- Nodes -->
    <g fill="none" stroke-width="4">
        <!-- Trigger Node (Green) -->
        <rect x="8" y="44" width="40" height="40" rx="8" stroke="#10B981" />
        
        <!-- Action Node Top (Blue) -->
        <rect x="80" y="8" width="40" height="40" rx="8" stroke="#0EA5E9" />
        
        <!-- Action Node Bottom (Blue) -->
        <rect x="80" y="80" width="40" height="40" rx="8" stroke="#0EA5E9" />
    </g>

    <!-- Handles -->
    <g fill="#e2ebeb">
        <circle cx="48" cy="64" r="2" />
        <circle cx="80" cy="28" r="2" />
        <circle cx="80" cy="100" r="2" />
    </g>
</svg>
